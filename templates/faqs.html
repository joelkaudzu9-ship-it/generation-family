{% extends "base.html" %}
{% block content %}

<section class="page-header" {% if section_images.get('faqs') %}style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('{{ section_images.get('faqs') }}'); background-size: cover; background-position: center;"{% endif %}>
    <div class="container">
        <h1 class="page-title">FAQs</h1>
        <p class="page-subtitle">Frequently asked questions</p>
    </div>
</section>

<section class="faqs-section">
    <div class="container">
        {% if faqs %}
        <div class="faqs-list">
            {% for faq in faqs %}
            <div class="faq-item">
                <h3>{{ faq.question }}</h3>
                <p>{{ faq.answer }}</p>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="faqs-list">
            <div class="faq-item">
                <h3>How do I join?</h3>
                <p>Visit our Family Groups page or contact us and we'll connect you.</p>
            </div>
        </div>
        {% endif %}
    </div>
</section>

{% endblock %}

{% extends "base.html" %}
{% block title %}Create Account — The Generation Family{% endblock %}

{% block content %}

<section class="page-header">
    <div class="container">
        <h1 class="page-title">Create Account</h1>
        <p class="page-subtitle">Join The Generation Family community</p>
    </div>
</section>

<section class="auth-section">
    <div class="container">
        <div class="auth-box">
            {% if error %}
            <div class="auth-error" style="background:rgba(231,76,60,0.1); border:1px solid rgba(231,76,60,0.3); color:#e74c3c; padding:12px; border-radius:10px; margin-bottom:20px; font-size:0.85rem;">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="full_name" required>
                </div>
                
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone">
                </div>
                
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label>Select Your Family Group *</label>
                    <select name="group_id" class="form-control" required style="width:100%; padding:12px; background:#111; border:1px solid #333; color:#fff; border-radius:10px;">
                        <option value="">— Select a Family Group —</option>
                        {% for group in groups %}
                        <option value="{{ group.id }}" {% if request.args.get('group_id')|int == group.id %}selected{% endif %}>
                            {{ group.name }} — {{ group.city }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit" class="btn-gold" style="width:100%;">Create Account & Join Group</button>
            </form>
            
            <p class="auth-redirect">
                Already have an account? <a href="/member/login">Login here</a>
            </p>
        </div>
    </div>
</section>

<style>
.auth-section {
    padding: 60px 0;
    background: var(--black);
}

.auth-box {
    max-width: 500px;
    margin: 0 auto;
    background: var(--dark);
    border: 1px solid #222;
    border-radius: 20px;
    padding: 40px;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.auth-redirect {
    text-align: center;
    margin-top: 24px;
    color: var(--gray);
    font-size: 0.85rem;
}

.auth-redirect a {
    color: var(--gold);
    text-decoration: none;
}
</style>

{% endblock %}

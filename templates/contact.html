{% extends "base.html" %}
{% block content %}

<section class="page-header" {% if section_images.get('contact') %}style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('{{ section_images.get('contact') }}'); background-size: cover; background-position: center;"{% endif %}>
    <div class="container">
        <h1 class="page-title">Contact Us</h1>
        <p class="page-subtitle">We'd love to hear from you. Reach out and we'll get back to you shortly.</p>
    </div>
</section>

<section class="contact-section">
    <div class="container">
        <div class="contact-grid">
            <div class="contact-form-wrapper">
                <h3>Send Us a Message</h3>
                <form class="contact-form" method="POST" action="/contact" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="Your email address" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="What's this about?">
                    </div>
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>
                    <button type="submit" class="btn-gold" id="contactSubmitBtn">Send Message</button>
                    <div class="form-feedback" id="contactFeedback"></div>
                </form>
            </div>

        </div>
    </div>
</section>

<script>
// Show success toast if form was just submitted
{% if success %}
document.addEventListener('DOMContentLoaded', function() {
    showToast("Message sent! We'll get back to you soon.", 'success');
});
{% endif %}

// Contact form with loading state
const contactForm = document.getElementById('contactForm');
if (contactForm) {
    contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('contactSubmitBtn');
        const feedback = document.getElementById('contactFeedback');
        
        btn.classList.add('btn-loading');
        btn.textContent = 'Sending...';
        feedback.textContent = '';
        
        const formData = new FormData(contactForm);
        
        try {
            const response = await fetch('/contact', {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                // Reload to show toast
                window.location.reload();
            } else {
                throw new Error('Failed');
            }
        } catch (err) {
            feedback.textContent = 'Failed to send. Please try again.';
            feedback.style.color = '#e74c3c';
            btn.classList.remove('btn-loading');
            btn.textContent = 'Send Message';
        }
        
        setTimeout(() => {
            feedback.textContent = '';
        }, 5000);
    });
}
</script>

{% endblock %}

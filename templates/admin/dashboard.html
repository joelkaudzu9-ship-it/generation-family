{% extends "admin/base_admin.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h1>Welcome, {{ session.get('admin_user', {}).get('display_name', 'User') }}</h1>
<p>You have access to the sections below.</p>

<div class="admin-cards" id="dashboardCards"></div>

<script>
    var user = {
        roles: [],
        displayName: ''
    };
    {% if session.get('admin_user') %}
    user.displayName = '{{ session["admin_user"].get("display_name", "") }}';
    {% if session["admin_user"].get("roles") %}
    user.roles = [
        {% for role in session["admin_user"]["roles"] %}
        '{{ role }}'{% if not loop.last %},{% endif %}
        {% endfor %}
    ];
    {% elif session["admin_user"].get("role") %}
    user.roles = ['{{ session["admin_user"]["role"] }}'];
    {% endif %}
    {% endif %}

    var allSections = {
        settings: { icon: 'fa-cog', title: 'Settings', desc: 'Mission, vision, contact info', url: '/admin/settings', roles: ['admin'] },
        hero: { icon: 'fa-images', title: 'Hero Images', desc: 'Homepage slideshow', url: '/admin/hero', roles: ['admin'] },
        sectionImages: { icon: 'fa-layer-group', title: 'Section Images', desc: 'Page header backgrounds', url: '/admin/section-images', roles: ['admin'] },
        sermons: { icon: 'fa-microphone-alt', title: 'Sermons', desc: 'Upload and manage sermons', url: '/admin/sermons', roles: ['admin', 'sermons'] },
        leadership: { icon: 'fa-user-tie', title: 'Leadership', desc: 'Manage leaders', url: '/admin/leadership', roles: ['admin', 'leadership'] },
        ministries: { icon: 'fa-church', title: 'Ministries', desc: 'Manage departments', url: '/admin/ministries', roles: ['admin', 'ministries'] },
        testimonials: { icon: 'fa-quote-right', title: 'Testimonials', desc: 'Manage testimonies', url: '/admin/testimonials', roles: ['admin', 'testimonials'] },
        events: { icon: 'fa-calendar-alt', title: 'Events', desc: 'Create and manage events', url: '/admin/events', roles: ['admin', 'events'] },
        blog: { icon: 'fa-blog', title: 'Blog', desc: 'Write and manage posts', url: '/admin/blog', roles: ['admin', 'blog'] },
        messages: { icon: 'fa-envelope', title: 'Messages', desc: 'View contact submissions', url: '/admin/messages', roles: ['admin'] },
        newsletter: { icon: 'fa-paper-plane', title: 'Newsletter', desc: 'Send to subscribers', url: '/admin/newsletter', roles: ['admin'] },
        users: { icon: 'fa-users-cog', title: 'Users', desc: 'Manage access and roles', url: '/admin/users', roles: ['admin'] },
        prayerRhythms: { icon: 'fa-praying-hands', title: 'Prayer Rhythms', desc: 'Manage schedule', url: '/admin/prayer-rhythms', roles: ['admin'] },
        familyGroups: { icon: 'fa-users', title: 'Family Groups', desc: 'Manage groups', url: '/admin/family-groups', roles: ['admin'] },
        marketplaceItems: { icon: 'fa-store', title: 'Marketplace', desc: 'Manage listings', url: '/admin/marketplace', roles: ['admin'] },
        retreatsManage: { icon: 'fa-mountain', title: 'Retreats', desc: 'Manage retreats', url: '/admin/retreats', roles: ['admin'] },
        storySections: { icon: 'fa-book-open', title: 'Our Story', desc: 'Edit founding story', url: '/admin/story-sections', roles: ['admin'] },
        givingInfo: { icon: 'fa-hand-holding-heart', title: 'Giving Info', desc: 'Manage methods', url: '/admin/giving-info', roles: ['admin'] },
        faqsManage: { icon: 'fa-question-circle', title: 'FAQs', desc: 'Manage Q&A', url: '/admin/faqs-manage', roles: ['admin'] },
        creatives: { icon: 'fa-palette', title: 'Creatives', desc: 'Music, drama, poems', url: '/admin/creatives', roles: ['admin', 'creatives'] },
        media: { icon: 'fa-photo-video', title: 'Media', desc: 'Audio, photos, videos', url: '/admin/media', roles: ['admin', 'media'] }
    };

    function hasAccess(r) {
        if (user.roles.indexOf('admin') !== -1) return true;
        for (var i = 0; i < r.length; i++) {
            if (user.roles.indexOf(r[i]) !== -1) return true;
        }
        return false;
    }

    var nav = document.querySelector('.admin-nav-links');
    var cards = document.getElementById('dashboardCards');
    var navHTML = '<a href="/admin"><i class="fas fa-home"></i> Dashboard</a>';
    var cardsHTML = '';

    for (var k in allSections) {
        if (hasAccess(allSections[k].roles)) {
            navHTML += '<a href="' + allSections[k].url + '"><i class="fas ' + allSections[k].icon + '"></i> ' + allSections[k].title + '</a>';
            cardsHTML += '<a href="' + allSections[k].url + '" class="admin-card"><span class="admin-card-icon"><i class="fas ' + allSections[k].icon + '"></i></span><h3>' + allSections[k].title + '</h3><p>' + allSections[k].desc + '</p></a>';
        }
    }
    navHTML += '<a href="/">View Site</a>';
    nav.innerHTML = navHTML;
    cards.innerHTML = cardsHTML;
</script>
{% endblock %}

{% extends "admin/base_admin.html" %}
{% block title %}Newsletter{% endblock %}

{% block nav %}
<nav class="admin-nav">
    <h2><a href="/admin"><i class="fas fa-crown gold-text"></i> TGF Admin</a></h2>
    <div class="admin-nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/admin/newsletter" class="active">Newsletter</a>
        <a href="/">View Site</a>
        <a href="/admin/logout" class="logout-link">Logout</a>
    </div>
</nav>
{% endblock %}

{% block content %}
<h1>Send Newsletter</h1>
<p class="subscriber-count"><i class="fas fa-users gold-text"></i> Sending to all active subscribers via Brevo.</p>

<form method="POST" class="admin-form" id="newsletterFormAdmin">
    <div class="form-group"><label>Subject *</label><input type="text" name="subject" required></div>
    <div class="form-group"><label>Message *</label><textarea name="content" id="nlContent" rows="10" required></textarea></div>
    <button type="submit" class="btn-save" id="newsletterSendBtn"><i class="fas fa-paper-plane"></i> Send to All Subscribers</button>
</form>

<div class="newsletter-preview" id="preview" style="display:none;">
    <div class="newsletter-preview-header"><h2>The Generation Family</h2></div>
    <div id="previewContent"></div>
</div>

<script>
    var contentInput = document.getElementById('nlContent');
    var preview = document.getElementById('preview');
    var previewContent = document.getElementById('previewContent');
    if (contentInput) {
        contentInput.addEventListener('input', function() {
            var text = contentInput.value.trim();
            if (text) { preview.style.display = 'block'; previewContent.textContent = text; }
            else { preview.style.display = 'none'; }
        });
    }
</script>

<style>
    .newsletter-preview { background: #0a0a0a; color: #ccc; padding: 25px; border-radius: 10px; border: 1px solid #1a1a1a; line-height: 1.8; margin-top: 20px; min-height: 100px; white-space: pre-wrap; }
    .newsletter-preview-header { text-align: center; color: #D4AF37; margin-bottom: 15px; font-family: 'Playfair Display', serif; }
    .subscriber-count { color: var(--gray); font-size: 0.85rem; margin-bottom: 24px; }
    .subscriber-count strong { color: var(--gold); }
</style>
{% endblock %}

{% extends "admin/base_admin.html" %}
{% block title %}Edit {{ ministry.name }} Content{% endblock %}

{% block content %}

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<h1>{{ ministry.name }} — Content Editor</h1>

<form method="POST" id="contentForm">
    <div id="editor" style="height: 400px; background: white; color: black; margin-bottom: 20px; border-radius: 8px;"></div>
    <textarea name="content" id="hiddenContent" style="display:none;">{{ content or '' }}</textarea>
    
    <div style="display: flex; gap: 12px; margin-top: 20px;">
        <button type="submit" class="btn-save">Save Content</button>
        <a href="/admin/ministries" class="btn-cancel">Back</a>
        <a href="/ministries/{{ ministry.slug }}" class="btn-cancel" target="_blank">Preview</a>
    </div>
</form>

<script>
    var toolbarOptions = [
        ['bold', 'italic', 'underline'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['link', 'image'],
        ['clean']
    ];
    
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: { toolbar: toolbarOptions }
    });
    
    // Load existing content
    var existing = document.getElementById('hiddenContent').value;
    if (existing) quill.root.innerHTML = existing;
    
    // Custom image upload
    var toolbar = quill.getModule('toolbar');
    toolbar.addHandler('image', function() {
        var input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.click();
        
        input.onchange = async function() {
            var file = input.files[0];
            var formData = new FormData();
            formData.append('image', file);
            
            var range = quill.getSelection();
            quill.insertText(range.index, 'Uploading...', 'italic');
            
            var res = await fetch('/admin/upload-editor-image', {
                method: 'POST',
                body: formData
            });
            var data = await res.json();
            
            quill.deleteText(range.index, 11);
            if (data.url) {
                quill.insertEmbed(range.index, 'image', data.url);
            } else {
                quill.insertText(range.index, 'Upload failed', 'italic');
            }
        };
    });
    
    document.getElementById('contentForm').onsubmit = function() {
        document.getElementById('hiddenContent').value = quill.root.innerHTML;
    };
</script>

<style>
    .ql-editor { min-height: 350px; }
    .ql-editor img { max-width: 100%; }
    .btn-save { background: #D4AF37; color: black; padding: 10px 20px; border: none; cursor: pointer; border-radius: 8px; }
    .btn-cancel { background: transparent; border: 1px solid #333; color: #999; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
</style>

{% endblock %}

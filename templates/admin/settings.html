{% extends "admin/base_admin.html" %}
{% block title %}Settings{% endblock %}

{% block nav %}
<nav class="admin-nav">
    <h2><a href="/admin"><i class="fas fa-crown gold-text"></i> TGF Admin</a></h2>
    <div class="admin-nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/admin/settings" class="active">Settings</a>
        <a href="/">View Site</a>
        <a href="/admin/logout" class="logout-link">Logout</a>
    </div>
</nav>
{% endblock %}

{% block content %}
<h1>Site Settings</h1>

<form method="POST" class="admin-form">
    <fieldset>
        <legend><i class="fas fa-home"></i> Homepage</legend>
        <div class="form-group"><label>Hero Tagline</label><input type="text" name="hero_tagline" value="{{ settings.get('hero_tagline', '') }}"></div>
        <div class="form-group"><label>Year Theme</label><input type="text" name="year_theme" value="{{ settings.get('year_theme', '') }}"></div>
    </fieldset>

    <fieldset>
        <legend><i class="fas fa-cross"></i> Mission / Vision / Values</legend>
        <div class="form-group"><label>Mission</label><textarea name="mission" rows="2">{{ settings.get('mission', '') }}</textarea></div>
        <div class="form-group"><label>Vision</label><textarea name="vision" rows="2">{{ settings.get('vision', '') }}</textarea></div>
        <div class="form-group"><label>Values</label><input type="text" name="values" value="{{ settings.get('values', '') }}"></div>
    </fieldset>

    <fieldset>
        <legend><i class="fas fa-info-circle"></i> About Page</legend>
        <div class="form-group"><label>About Intro</label><textarea name="about_intro" rows="3">{{ settings.get('about_intro', '') }}</textarea></div>
        <div class="form-group"><label>About Description</label><textarea name="about_description" rows="3">{{ settings.get('about_description', '') }}</textarea></div>
    </fieldset>

    <fieldset>
        <legend><i class="fas fa-chart-bar"></i> Impact Numbers</legend>
        <div class="form-row">
            <div class="form-group"><label>Lives Impacted</label><input type="text" name="lives_impacted" value="{{ settings.get('lives_impacted', '') }}"></div>
            <div class="form-group"><label>Years in Ministry</label><input type="text" name="years_in_existence" value="{{ settings.get('years_in_existence', '') }}"></div>
            <div class="form-group"><label>Cities</label><input type="text" name="cities" value="{{ settings.get('cities', '') }}"></div>
            <div class="form-group"><label>Meetings Held</label><input type="text" name="meetings_held" value="{{ settings.get('meetings_held', '') }}"></div>
        </div>
    </fieldset>

    <fieldset>
        <legend><i class="fas fa-address-book"></i> Contact</legend>
        <div class="form-group"><label>Address</label><input type="text" name="church_address" value="{{ settings.get('church_address', '') }}"></div>
        <div class="form-group"><label>Phone</label><input type="text" name="church_phone" value="{{ settings.get('church_phone', '') }}"></div>
        <div class="form-group"><label>Email</label><input type="email" name="church_email" value="{{ settings.get('church_email', '') }}"></div>
    </fieldset>

    <button type="submit" class="btn-save">Save All Settings</button>
</form>
{% endblock %}

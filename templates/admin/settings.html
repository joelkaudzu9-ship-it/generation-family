<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Settings — TGF Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
    <nav class="admin-nav">
        <h2><a href="/admin">TGF Admin</a></h2>
        <div class="admin-nav-links">
            <a href="/admin/settings" class="active">Settings</a>
            <a href="/admin/sermons">Sermons</a>
            <a href="/admin/leadership">Leadership</a>
            <a href="/admin/testimonials">Testimonials</a>
            <a href="/admin/events">Events</a>
            <a href="/">View Site</a>
            <a href="/admin/logout" class="logout-link">Logout</a>
        </div>
    </nav>
    <main class="admin-main">
        <h1>Site Settings</h1>
        <p>These values appear across the website.</p>
        <form method="POST" class="admin-form">
            <fieldset>
                <legend>Homepage</legend>
                <div class="form-group">
                    <label>Hero Tagline</label>
                    <input type="text" name="hero_tagline" value="{{ settings.get('hero_tagline', '') }}" placeholder="A Spiritual & Growth Family">
                </div>
                <div class="form-group">
                    <label>Year Theme</label>
                    <input type="text" name="year_theme" value="{{ settings.get('year_theme', '') }}" placeholder="TGF 2026 - Year Of Divine Establishment">
                </div>
            </fieldset>

            <fieldset>
                <legend>Mission / Vision / Values</legend>
                <div class="form-group">
                    <label>Mission</label>
                    <textarea name="mission" rows="2">{{ settings.get('mission', '') }}</textarea>
                </div>
                <div class="form-group">
                    <label>Vision</label>
                    <textarea name="vision" rows="2">{{ settings.get('vision', '') }}</textarea>
                </div>
                <div class="form-group">
                    <label>Values</label>
                    <input type="text" name="values" value="{{ settings.get('values', '') }}" placeholder="Faith. Family. Integrity. Service. Excellence. Love.">
                </div>
            </fieldset>

            <fieldset>
                <legend>Impact Numbers</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label>Lives Impacted</label>
                        <input type="text" name="lives_impacted" value="{{ settings.get('lives_impacted', '') }}">
                    </div>
                    <div class="form-group">
                        <label>Years in Ministry</label>
                        <input type="text" name="years_in_existence" value="{{ settings.get('years_in_existence', '') }}">
                    </div>
                    <div class="form-group">
                        <label>Cities</label>
                        <input type="text" name="cities" value="{{ settings.get('cities', '') }}">
                    </div>
                    <div class="form-group">
                        <label>Meetings Held</label>
                        <input type="text" name="meetings_held" value="{{ settings.get('meetings_held', '') }}">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-group">
                    <label>Church Address</label>
                    <input type="text" name="church_address" value="{{ settings.get('church_address', '') }}">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="church_phone" value="{{ settings.get('church_phone', '') }}">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="church_email" value="{{ settings.get('church_email', '') }}">
                </div>
            </fieldset>

            <button type="submit" class="btn-save">Save All Settings</button>
        </form>
    </main>
</body>
</html>

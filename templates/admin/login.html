<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — The Generation Family</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="admin-login-body">
    <div class="admin-login-box">
        <div class="admin-login-header">
            <div class="admin-login-logo">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>TGF Admin</h1>
            <p>Enter password to manage the website</p>
        </div>
        {% if error %}
        <div class="admin-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}
        <form method="POST" class="admin-login-form" id="loginForm">
            <div class="input-icon-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required autofocus>
            </div>
            <button type="submit" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="btn-spinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
        </form>
        <a href="/" class="back-to-site"><i class="fas fa-arrow-left"></i> Back to site</a>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            document.querySelector('#loginBtn .btn-text').style.display = 'none';
            document.querySelector('#loginBtn .btn-spinner').style.display = 'inline';
            document.getElementById('loginBtn').disabled = true;
        });
    </script>
</body>
</html>

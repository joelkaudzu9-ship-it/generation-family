<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Testimonials — TGF Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
    <nav class="admin-nav">
        <h2><a href="/admin">TGF Admin</a></h2>
        <div class="admin-nav-links">
            <a href="/admin/sermons">Sermons</a>
            <a href="/admin/leadership">Leadership</a>
            <a href="/admin/testimonials" class="active">Testimonials</a>
            <a href="/admin/events">Events</a>
            <a href="/">View Site</a>
            <a href="/admin/logout" class="logout-link">Logout</a>
        </div>
    </nav>
    <main class="admin-main">
        <h1>Add Testimonial</h1>
        <form method="POST" class="admin-form">
            <div class="form-group">
                <label>Name *</label>
                <input type="text" name="name" placeholder="e.g. Grace M." required>
            </div>
            <div class="form-group">
                <label>Testimony *</label>
                <textarea name="quote" rows="4" placeholder="What did God do in their life?" required></textarea>
            </div>
            <button type="submit" class="btn-save">Add Testimonial</button>
        </form>

        <hr class="admin-divider">

        <h2>Current Testimonials</h2>
        {% if testimonials %}
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Quote</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for t in testimonials %}
                <tr>
                    <td>{{ t.name }}</td>
                    <td>{{ t.quote[:80] }}...</td>
                    <td>
                        <form method="POST" action="/admin/testimonials/{{ t.id }}/delete" onsubmit="return confirm('Delete?')">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="empty-state">No testimonials yet.</p>
        {% endif %}
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events — TGF Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
    <nav class="admin-nav">
        <h2><a href="/admin">TGF Admin</a></h2>
        <div class="admin-nav-links">
            <a href="/admin/sermons">Sermons</a>
            <a href="/admin/leadership">Leadership</a>
            <a href="/admin/testimonials">Testimonials</a>
            <a href="/admin/events" class="active">Events</a>
            <a href="/">View Site</a>
            <a href="/admin/logout" class="logout-link">Logout</a>
        </div>
    </nav>
    <main class="admin-main">
        <h1>Add Event</h1>
        <form method="POST" enctype="multipart/form-data" class="admin-form">
            <div class="form-group">
                <label>Event Title *</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="event_date">
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" name="event_time">
                </div>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="Church auditorium, etc.">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Image</label>
                <input type="file" name="image" accept="image/*">
            </div>
            <button type="submit" class="btn-save">Add Event</button>
        </form>

        <hr class="admin-divider">

        <h2>Upcoming Events</h2>
        {% if events %}
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for event in events %}
                <tr>
                    <td>{{ event.title }}</td>
                    <td>{{ event.event_date or '—' }}</td>
                    <td>{{ event.location or '—' }}</td>
                    <td>
                        <form method="POST" action="/admin/events/{{ event.id }}/delete" onsubmit="return confirm('Delete?')">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="empty-state">No events yet.</p>
        {% endif %}
    </main>
</body>
</html>
